name: manual parameterized

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "Application name"
        required: true
        type: string

      run_validation:
        description: "Run validation"
        required: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      validation_status: ${{ steps.validation.outputs.validation_status }}

    steps:
      - name: Validate application
        id: validation
        run: |
          echo "Application Name: ${{ inputs.application_name }}"
          echo "Run Validation: ${{ inputs.run_validation }}"

          if [ "${{ inputs.run_validation }}" = "true" ]; then
            echo "Validation is enabled."
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Validation is disabled."
            echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          fi

  summary:
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Execution summary
        run: |
          echo "Application '${{ inputs.application_name }}' validation completed successfully."
          echo "Final execution summary: Validation succeeded."
