name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: false
        default: "dev"
        type: string

      version:
        description: "Version"
        required: true
        type: string

jobs:
  print-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: Print inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
